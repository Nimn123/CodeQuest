<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODE QUEST — AI Bug Hunt</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--cyan:#39d6ee;--violet:#a78bfa;--lime:#b7f34b;--text:#f4f7ff;--muted:#aab5cc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at top right,#202b51,var(--bg) 55%)}
.app{width:min(720px,100%)}.eyebrow{color:var(--cyan);text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;font-weight:800}h1{margin:8px 0;font-size:clamp(2rem,6vw,3.3rem)}.subtitle{color:var(--muted);margin:0 0 22px}
.card{background:rgba(21,29,50,.94);border:1px solid #303d5c;border-radius:22px;padding:clamp(20px,5vw,32px);box-shadow:0 24px 70px #0005}.topline{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem}
.progress{height:8px;background:#303a53;border-radius:99px;overflow:hidden;margin:14px 0 24px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .25s}
h2{line-height:1.35;font-size:clamp(1.2rem,3vw,1.6rem)}.answers{display:grid;gap:10px;margin-top:20px}button{font:inherit;cursor:pointer}.answer{text-align:left;color:var(--text);background:#202b45;border:1px solid #3a4868;border-radius:12px;padding:14px 16px}
.answer:hover{border-color:var(--cyan)}.answer:disabled{cursor:default;opacity:.88}.answer.correct{border-color:var(--lime);background:#23351f}.answer.incorrect{border-color:#ff7272;background:#3b222c}
.feedback{min-height:28px;margin:16px 0 0;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.primary,.secondary{border:0;border-radius:12px;padding:12px 18px;font-weight:800}.primary{color:#06131c;background:var(--cyan)}.secondary{color:var(--text);background:#303b56}.primary:disabled{opacity:.35;cursor:not-allowed}.hidden{display:none}.result{text-align:center;padding:16px 0 4px}.score-big{font-size:3rem;font-weight:900;color:var(--lime)}.footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:16px}
</style></head>
<body><main class="app">
<div class="eyebrow">CODE QUEST // Mission 002</div><h1>AI Bug Hunt</h1><p class="subtitle">Can you spot what an AI coding agent should fix?</p>
<section class="card" id="quizCard"><div class="topline"><span id="questionCount">Question 1 of 5</span><span>Score: <strong id="score">0</strong></span></div>
<div class="progress"><div id="progressBar"></div></div><h2 id="questionText"></h2><div class="answers" id="answers"></div>
<p class="feedback" id="feedback" aria-live="polite">Choose an answer to begin.</p><div class="controls"><button class="primary" id="nextBtn" disabled>Next question →</button><button class="secondary" id="restartBtn">Restart</button></div></section>
<section class="card result hidden" id="resultCard"><div class="eyebrow">Mission report</div><h2>Challenge complete!</h2><div class="score-big"><span id="finalScore">0</span> / 5</div><p id="resultMessage">Nice work.</p><button class="primary" id="playAgainBtn">Play again</button></section>
<p class="footer">Built for learning. Test every change before you ship it.</p></main>
<script>
const questions=[
{question:"What does an LLM commonly predict while generating text?",answers:["The next token","The user's password","The next calendar year","A random file"],correct:0,explanation:"Many language models generate text by repeatedly predicting a next token."},
{question:"What is a token?",answers:["Always a full word","A piece of text processed by a model","A type of monitor","A Git branch"],correct:1,explanation:"A token can be a word, part of a word, punctuation, or another text unit."},
{question:"Why should AI-generated code be tested?",answers:["It can look right but still fail","Testing makes code longer","AI code cannot run in browsers","Tests replace understanding"],correct:0,explanation:"Generated code may contain logic errors or use unsupported APIs."},
{question:"What does Git help developers do?",answers:["Track changes over time","Increase Wi-Fi speed","Design every image","Guarantee bug-free code"],correct:0,explanation:"Git records project history so changes can be reviewed and restored."},
{question:"What is a good response to a suspicious AI claim?",answers:["Share it immediately","Check reliable evidence","Assume confidence means truth","Delete all source code"],correct:1,explanation:"Important claims should be verified with trustworthy evidence."}
];
let currentQuestion=0,score=0,answered=false;
const $=id=>document.getElementById(id);
const questionCount=$("questionCount"),scoreEl=$("score"),progressBar=$("progressBar"),questionText=$("questionText"),answersEl=$("answers"),feedback=$("feedback"),nextBtn=$("nextBtn"),quizCard=$("quizCard"),resultCard=$("resultCard"),finalScore=$("finalScore"),resultMessage=$("resultMessage");
function renderQuestion(){const q=questions[currentQuestion];answered=false;questionCount.textContent=`Question ${currentQuestion+1} of ${questions.length}`;questionText.textContent=q.question;scoreEl.textContent=score;progressBar.style.width=`${currentQuestion/questions.length*100}%`;feedback.textContent="Choose an answer to begin.";nextBtn.disabled=true;answersEl.innerHTML="";
q.answers.forEach((answer,index)=>{const button=document.createElement("button");button.className="answer";button.textContent=answer;button.addEventListener("click",()=>selectAnswer(index));answersEl.appendChild(button);});}
function selectAnswer(selectedIndex){const q=questions[currentQuestion],buttons=answersEl.querySelectorAll("button");
// BUG #1: no guard against processing the same question more than once.
if(selectedIndex===q.correct){score+=1;scoreEl.textContent=score;feedback.textContent=`Correct! ${q.explanation}`;}else{feedback.textContent=`Not quite. ${q.explanation}`;}
buttons.forEach((button,index)=>{button.disabled=true;if(index===q.correct)button.classList.add("correct");if(index===selectedIndex&&index!==q.correct)button.classList.add("incorrect");});answered=true;nextBtn.disabled=false;}
nextBtn.addEventListener("click",()=>{if(currentQuestion<questions.length-1){currentQuestion+=1;renderQuestion();}else showResults();});
function showResults(){quizCard.classList.add("hidden");resultCard.classList.remove("hidden");finalScore.textContent=score;progressBar.style.width="100%";resultMessage.textContent=score>=4?"Excellent debugging instincts!":"Good attempt — review the explanations and try again.";}
function restartQuiz(){currentQuestion=0;
// BUG #2: score is not reset when restarting.
quizCard.classList.remove("hidden");resultCard.classList.add("hidden");renderQuestion();}
$("restartBtn").addEventListener("click",restartQuiz);$("playAgainBtn").addEventListener("click",restartQuiz);renderQuestion();
</script></body></html>
